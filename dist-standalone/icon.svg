<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1e2f"/>
      <stop offset="100%" stop-color="#0a0a12"/>
    </radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with safe zone margin for maskable icon -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Outer Tech Hex/Shield Frame -->
  <path d="M256 64 L400 132 L400 276 C400 364 338 428 256 460 C174 428 112 364 112 276 L112 132 Z" 
        fill="none" stroke="url(#neon)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>
        
  <!-- Inner Shield -->
  <path d="M256 94 L374 150 L374 270 C374 344 322 398 256 426 C190 398 138 344 138 270 L138 150 Z" 
        fill="#12131f" stroke="url(#neon)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Padlock Shackle -->
  <path d="M216 230 L216 190 C216 168 234 150 256 150 C278 150 296 168 296 190 L296 230" 
        fill="none" stroke="#f8fafc" stroke-width="18" stroke-linecap="round"/>

  <!-- Padlock Body -->
  <rect x="196" y="226" width="120" height="96" rx="20" fill="url(#neon)"/>
  
  <!-- Keyhole -->
  <circle cx="256" cy="264" r="10" fill="#090a0f"/>
  <path d="M256 268 L256 294" stroke="#090a0f" stroke-width="8" stroke-linecap="round"/>

  <!-- 24h Circular Arc Indicator around bottom -->
  <path d="M180 370 A100 100 0 0 0 332 370" fill="none" stroke="#38bdf8" stroke-width="8" stroke-dasharray="8 8" stroke-linecap="round"/>
  <text x="256" y="388" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="2">24H</text>
</svg>
